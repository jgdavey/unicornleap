name: Release

on:
  push:
    tags: ['v[0-9]+.*']

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Fails the release if CHANGELOG.md has no section for this tag.
      - name: Extract changelog section
        run: scripts/changelog-notes "$GITHUB_REF_NAME" > notes.md
      - name: Create draft release (once)
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it as-is"
          else
            # Anything after X.Y.Z (v3.0.0.pre, v3.0.0-rc.1) is a prerelease.
            prerelease=()
            if [[ ! "${GITHUB_REF_NAME#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${prerelease[@]}" \
              --draft --generate-notes --notes-file notes.md --title "$GITHUB_REF_NAME"
          fi

  build:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write     # upload assets to the draft release
      id-token: write     # packslip signs with this job's OIDC identity
      attestations: write # packslip attests the tarball's build provenance
    steps:
      - uses: actions/checkout@v6
      - name: Check version matches tag
        run: |
          grep -qx "let version = \"${GITHUB_REF_NAME#v}\"" UnicornLeap/Version.swift || {
            echo "UnicornLeap/Version.swift doesn't match tag $GITHUB_REF_NAME" >&2
            exit 1
          }
      - name: Test
        run: make test
      - name: Build universal binary
        run: |
          make universal
          lipo -info build/unicornleap
      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="unicornleap-${version}-macos-universal"
          mkdir -p staging
          cp -R build/unicornleap build/completions README.md staging/
          # Name the entries rather than "." so their paths have no "./"
          # prefix: release.toml names them exactly.
          tar czf "${name}.tar.gz" -C staging unicornleap completions README.md
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Upload assets to draft release
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --clobber
      # Signs a manifest of the tarball and uploads it to the draft release
      # as packslip.sigstore.json, for mise's packslip backend.
      - name: Publish packslip
        uses: jdx/packslip@e0340e0c1d10c90a434de2b90f3a1ba345923564 # v1.11.4
        with:
          artifacts: ${{ steps.package.outputs.archive }}
          manifest: release.toml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Mark release published
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
